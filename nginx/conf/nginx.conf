worker_processes  1;

events {
	worker_connections  1024;
}

stream {

    server {
        listen     636 ssl;

        proxy_pass 127.0.0.1:389;
		
		ssl_certificate      orange-chained-ssl.crt;
		ssl_certificate_key  orange-private-key.pem;

		ssl_session_cache    shared:SSL2:1m;
		ssl_session_timeout  5m;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers  off;
		
		ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
		# Remove ECDSA ciphers as not supported with our certificate - ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
    }
	
#	log_format combined '$remote_addr - - [$time_local] $hostname $protocol $status $bytes_sent $bytes_received $session_time upstream: $upstream_addr';
#	access_log logs/access.log combined;

}

http {
	include       mime.types;
	default_type  application/octet-stream;

	sendfile        on;

	keepalive_timeout  65;

	server_tokens	off;

	server {
		listen       80;

		server_name  _;
		
		return		301 https://$host$request_uri;
	}
	
	server {
		listen       443 ssl;
		
		proxy_set_header    X-Real-IP $remote_addr;
       proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header    Host $http_host;
		#proxy_set_header    X-Forwarded-For;
		set_real_ip_from 172.23.226.2;
		real_ip_header X-Forwarded-For;
		
		server_name  localhost;

		ssl_certificate      orange-chained-ssl.crt;
		ssl_certificate_key  orange-private-key.pem;

		ssl_session_cache    shared:SSL:1m;
		ssl_session_timeout  5m;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers  off;
		
		ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
		# Remove ECDSA ciphers as not supported with our certificate - ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
		
		add_header Strict-Transport-Security "max-age=31536000" always; 		
		
		location / {
			root   html;
			index  index.html index.htm;
		}
		
		location /gpconnect-demonstrator/v0/ {
			proxy_pass http://127.0.0.1:9090/gpconnect-demonstrator/v0_7/;
		}

		location /gpconnect-demonstrator/v0_7/ {
			proxy_pass http://127.0.0.1:9090/gpconnect-demonstrator/v0_7/;
		}

		location /gpconnect-demonstrator/v1/ {
			proxy_pass http://127.0.0.1:9091/gpconnect-demonstrator/v1/;
		}

		location /B82617/STU3/1/gpconnect/ {
			proxy_pass http://127.0.0.1:4854/B82617/STU3/1/gpconnect/;
			proxy_http_version 1.1;
		}

		location /B82617/STU3/1/gpconnect/structured/fhir/ {
			proxy_http_version 1.1;
			#proxy_set_header    X-Real-IP $remote_addr;
			#proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
			#proxy_set_header    Host $http_host;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_pass http://localhost:4854/B82617/STU3/1/gpconnect/fhir/;
		}
		
		location /B82617/STU3/1/gpconnect/structured/fhir/metadata/spine-directory/FHIR/R4/ {
			deny all;
		}
	 
		location /B82617/STU3/1/gpconnect/documents/fhir/ {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_pass http://localhost:4854/B82617/STU3/1/gpconnect/fhir/;
		}
		
		location /spine-directory/FHIR/R4/ {
                root   html;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                # see https://stackoverflow.com/questions/10395807/nginx-close-upstream-connection-after-request
                #proxy_set_header Connection "";
                # 1.5 demonstrator clear
                proxy_pass http://localhost:4855/;
		}

		# /STU3/Organization/X26 used by GPC Appointment Checker
		location /STU3/Organization/X26 {
				default_type application/json;
				return 200 '{"id" : "X26", "name" : "NHS ENGLAND - X26", "address" : {"line" : [ "The Leeds Government Hub", "7-8 Wellington Place" ], "AddressLine1" : "The Leeds Government Hub", "AddressLine2" : "7-8 Wellington Place", "city" : "Leeds", "district" : "", "country" : "England", "postalCode" : "LS1 4AP", "FullAddress" : "The Leeds Government Hub, 7-8 Wellington Place, Leeds, LS1 4AP, England" }, "PostalAddressFields" : [ "The Leeds Government Hub", " 7-8 Wellington Place", " Leeds", " LS1 4AP", " England" ], "type" : {"coding" : {"display" : "HSCOrg" }}, "issue" : null, "errorCode" : 0, "errorText" : null, "HasErrored" : false, "OrganisationLocationWithOdsCode" : "Nhs England - X26, The Leeds Government Hub, 7-8 Wellington Place, Leeds, LS1 4AP, England (X26)"}';
		}
		
		# /STU3/Organization/X24 used by GPC Appointment Checker
		location /STU3/Organization/X24 {
				default_type application/json;
				return 200 '{"id" : "X24", "name" : "NHS ENGLAND - X24", "address" : {"line" : [ "The Leeds Government Hub", "7-8 Wellington Place" ], "AddressLine1" : "The Leeds Government Hub", "AddressLine2" : "7-8 Wellington Place", "city" : "Leeds", "district" : "", "country" : "England", "postalCode" : "LS1 4AP", "FullAddress" : "The Leeds Government Hub, 7-8 Wellington Place, Leeds, LS1 4AP, England" }, "PostalAddressFields" : [ "The Leeds Government Hub", " 7-8 Wellington Place", " Leeds", " LS1 4AP", " England" ], "type" : {"coding" : {"display" : "HSCOrg" }}, "issue" : null, "errorCode" : 0, "errorText" : null, "HasErrored" : false, "OrganisationLocationWithOdsCode" : "Nhs England - X24, The Leeds Government Hub, 7-8 Wellington Place, Leeds, LS1 4AP, England (X24)"}';
		}
		
		location /ods-directory/FHIR/STU3/ {
                root   html;
                proxy_http_version 1.1;
                #proxy_set_header Host $host;
                #proxy_set_header X-Real-IP $remote_addr;
                # see https://stackoverflow.com/questions/10395807/nginx-close-upstream-connection-after-request
                #proxy_set_header Connection "";
                # 1.5 demonstrator clear
				proxy_pass http://localhost:4855/ods-directory/FHIR/STU3/;
        }
		
		location /gpc-ping/ {
			proxy_pass http://127.0.0.1:5005/gpc-ping/;
		}
		
#		location /jenkins {
#			proxy_pass http://127.0.0.1:8080/jenkins/;
#		}
		
		error_page   401 403 404	/40x.html;
		location = /40x.html {
			root   html;
		}		
		
		error_page   500 502 503 504  /50x.html;
		location = /50x.html {
			root   html;
		}		
	}
}
